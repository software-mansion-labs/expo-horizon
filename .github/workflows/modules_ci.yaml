name: Modules CI

on:
  pull_request:
    paths:
      - 'example/**'
      - 'expo-horizon-core/**'
      - 'expo-horizon-location/**'
      - 'expo-horizon-notifications/**'
      - '.github/workflows/modules_ci.yaml'
      - 'jest.config.js'
      - 'tests/**'

      # --- Shared paths for BOTH workflows ---
      - 'package.json'
      - 'yarn.lock'
      - '.eslintrc.js'
      - '.prettierrc'
      - '.prettierignore'
      - '.nvmrc'
      - '.eslintignore'
  push:
    branches:
      - main
    paths:
      - 'example/**'
      - 'expo-horizon-core/**'
      - 'expo-horizon-location/**'
      - 'expo-horizon-notifications/**'
      - '.github/workflows/modules_ci.yaml'
      - 'jest.config.js'
      - 'tests/**'

      # --- Shared paths for BOTH workflows ---
      - 'package.json'
      - 'yarn.lock'
      - '.eslintrc.js'
      - '.prettierrc'
      - '.prettierignore'
      - '.nvmrc'
      - '.eslintignore'

jobs:
  quality-checks:
    name: Libs Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: 📦 Install Yarn
        run: npm install -g yarn

      - name: 🌿 Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      - name: 📦 Install all dependencies
        id: install
        run: yarn install --frozen-lockfile

      - name: 🛠️ Build libraries
        id: build_libraries
        run: yarn build

      - name: 🔌 Build config plugins
        id: build_plugins
        run: yarn build:plugins

      # Keep independent checks running after a failure, but respect cancellation
      # and require their setup/build prerequisites to have succeeded.
      - name: 🤓 Run ESLint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn lint

      - name: ✨ Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn prettier:check

      - name: 🔍 Check TypeScript
        if: ${{ !cancelled() && steps.build_libraries.outcome == 'success' && steps.build_plugins.outcome == 'success' }}
        run: yarn ts:check

      - name: 🧪 Run Jest
        if: ${{ !cancelled() && steps.build_libraries.outcome == 'success' && steps.build_plugins.outcome == 'success' }}
        run: yarn test
