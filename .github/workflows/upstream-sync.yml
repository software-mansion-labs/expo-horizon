name: Upstream sync tooling

on:
  pull_request:
    paths:
      - 'scripts/sync-upstream-local.sh'
      - 'scripts/sync_upstream.py'
      - 'scripts/tests/**'
      - '.github/workflows/upstream-sync.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check shell entry point
        run: bash -n scripts/sync-upstream-local.sh
      - name: Test sync and recovery using local Git fixtures
        run: python3 -m unittest discover -s scripts/tests -v
