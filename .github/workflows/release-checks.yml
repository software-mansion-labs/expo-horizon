name: Release automation checks

on:
  pull_request:
    paths:
      - scripts/release.mjs
      - scripts/__tests__/**
      - .cursor/skills/**
      - AGENTS.md
      - CONTRIBUTING.md
      - .github/pull_request_template.md
      - .github/workflows/prepare-release.yml
      - .github/workflows/release-stable.yml
      - .github/workflows/release-checks.yml
  push:
    branches: [main]
    paths:
      - scripts/release.mjs
      - scripts/__tests__/**
      - .cursor/skills/**
      - AGENTS.md
      - CONTRIBUTING.md
      - .github/pull_request_template.md
      - .github/workflows/prepare-release.yml
      - .github/workflows/release-stable.yml
      - .github/workflows/release-checks.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/__tests__/*.test.mjs
      - name: Validate workflow syntax and expressions
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/prepare-release.yml .github/workflows/release-stable.yml .github/workflows/release-checks.yml
