plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

expoModule {
  canBePublished false
}

def horizonAppIdConfigField = "\"${project.findProperty('horizonAppId') ?: ''}\""

android {
  namespace "expo.modules.horizon"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    buildConfigField "String", "META_HORIZON_APP_ID", horizonAppIdConfigField
    consumerProguardFiles 'consumer-rules.pro'
  }
  lintOptions {
    abortOnError false
  }

  flavorDimensions += "device"
  productFlavors {
    quest { dimension "device" }
    mobile { dimension "device" }
  }
}

dependencies {
  // Only API stubs: Horizon OS supplies the implementation at runtime.
  compileOnly 'com.meta.metavr:metavr-os-jsdk:207'
  // This compatibility library is safe on older Horizon OS and other Android devices.
  implementation 'com.meta.metavrx.util:util:1.0.0'
  testImplementation 'junit:junit:4.13.2'
}
